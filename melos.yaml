name: json_serializable_immutable

sdkPath: "../encointer-wallet-flutter/.flutter"

packages:
  - builders/**
  - combine_example/*
  - typehelpers/**


command:
  bootstrap:
    runPubGetInParallel: false
    usePubspecOverrides: true

scripts:
#  test:
#    run: |
#      # FIXME: https://github.com/dart-lang/sdk/issues/45307
#      melos exec -- flutter test --no-pub
#    packageFilters:
#      dirExists:
#        - test
#        -
  pub-get:
    run: >-
      dart run melos exec -- \
      flutter pub get
    description: "Get pub dependencies"

  build_runner:
    run: melos exec --depends-on=build_runner -- "dart run build_runner build -d"

  analyze:
    run: melos exec -- dart analyze .

  postbootstrap:
    run: dart pub global activate build_runner
